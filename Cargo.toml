[package]
name = "victoria"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"

[lib]
name = "libvictoria"
path = "lib/lib.rs"

[dependencies]
anyhow = "1.0.68"
bytes = "1.3.0"
hex = "0.4.3"
regex = "1"
sha1 = "0.10.1"
rand = "0.10.2"
interprocess = { version = "2.4.4", features = ["tokio"] }

reqwest = { version = "0.11.18", features = ["json", "blocking"] } 
url = "2.5.8"

tokio = { version = "1.23.0", features = ["full", "tracing"] }
tokio-util = "0.7.19"
console-subscriber = "0.5.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "json"] }
tracing-appender = "0.2.5"

crossterm = "0.29.0"

directories = "6.0.0"
